<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSMS Report Card Generator</title>
<style>
  :root{
    --blue-dark:#0070AA;
    --blue-mid:#2E74B5;
    --shade-1:#D9EAF7;
    --shade-2:#E6F0F7;
    --shade-3:#EDF5FA;
    --ink:#000;
    --panel-bg:#f4f6f8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Times New Roman", Times, serif;
    background:var(--panel-bg);
    margin:0; padding:0; color:var(--ink);
  }

  /* ---------- Control panel (screen only) ---------- */
  #controls{
    max-width:900px; margin:0 auto; padding:24px 20px;
    font-family: Arial, Helvetica, sans-serif;
  }
  #controls h1{font-size:20px; margin:0 0 4px;}
  #controls p.sub{color:#555; font-size:13px; margin:0 0 18px;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  select, button{
    font-family: Arial, Helvetica, sans-serif; font-size:14px;
    padding:9px 14px; border-radius:6px; border:1px solid #c7d2db;
    background:#fff;
  }
  select{min-width:220px;}
  button{
    background:var(--blue-dark); color:#fff; border:none; cursor:pointer; font-weight:600;
  }
  button:hover{background:#005d8c;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.secondary{background:#fff; color:var(--blue-dark); border:1px solid var(--blue-dark);}
  button.secondary:hover{background:#eef6fb;}
  #status{font-size:13px; color:#555; margin-top:4px; white-space:pre-line;}
  #status.err{color:#a4201c; font-weight:600;}
  #cardsArea{max-width:900px; margin:0 auto; padding:0 20px 60px;}

  /* ---------- Gate screens (login / access denied / loading) ---------- */
  #gate{
    max-width:480px; margin:80px auto; padding:28px 26px;
    font-family: Arial, Helvetica, sans-serif;
    background:#fff; border:1px solid #d9e1e8; border-radius:10px;
    text-align:center;
  }
  #gate h2{margin:0 0 10px; font-size:18px; color:var(--blue-dark);}
  #gate p{margin:0 0 6px; font-size:14px; color:#444;}
  #gate.denied h2{color:#a4201c;}
  .spinner{
    width:26px; height:26px; margin:0 auto 14px;
    border:3px solid #d9e1e8; border-top-color:var(--blue-dark);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Report card ---------- */
  .page{
    width:210mm;
    min-height:297mm;
    margin:0 auto 24px;
    background:#fff;
    border:1.5pt solid #000;
    padding:9mm 10mm;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    display:flex; flex-direction:column;
  }
  .hdr{text-align:center; margin-bottom:3mm;}
  .hdr img{height:50mm; margin-bottom:1mm;}
  .hdr .t1{color:var(--blue-dark); font-weight:bold; font-size:15pt; margin:0;}
  .hdr .t2{font-weight:bold; font-size:13pt; margin:1mm 0 0;}
  .hdr .t3{font-weight:bold; font-size:11pt; margin:0;}

  table{width:100%; border-collapse:collapse; font-size:10pt;}
  .idtable td{border:1pt solid #000; padding:2mm 3mm; font-weight:bold;}
  .idtable{margin-bottom:3mm;}
  .idtable .lbl{width:18%;}
  .idtable .val{width:32%; font-weight:normal;}

  .marks-table{margin-bottom:3mm;}
  .marks-table th, .marks-table td{
    border:1pt solid #000; padding:1.6mm 2mm; text-align:center;
  }
  .marks-table th{font-size:9.5pt;}
  .marks-table td.subject, .marks-table th.subject{text-align:left; font-weight:bold;}
  .shade1{background:var(--shade-1);}
  .shade2{background:var(--shade-2);}
  .shade3{background:var(--shade-3);}
  .grand td{font-weight:bold; background:var(--shade-2);}
  .status-cell{font-style:italic;}

  .section-title{
    color:var(--blue-mid); font-weight:bold; text-align:center;
    font-size:12pt; margin:2mm 0 2mm;
  }
  .pronounce{font-size:9.5pt; font-weight:bold; margin:9mm 0 auto;}
  .signrow{display:flex; justify-content:space-around; margin-top:auto; padding-top:10mm; font-size:9.5pt; font-weight:bold;}

  /* ---------- Print ---------- */
  @media print{
    #controls, #gate, #status-bar{display:none !important;}
    body{background:#fff;}
    #cardsArea{padding:0; margin:0; max-width:none;}
    .page{
      box-shadow:none; margin:0; border:1.5pt solid #000;
      width:210mm; height:297mm; min-height:0;
      page-break-after:always;
    }
    .page:last-child{page-break-after:auto;}
    @page{ size:A4; margin:5mm; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="spinner"></div>
  <h2>Checking access…</h2>
  <p>Please wait.</p>
</div>

<div id="controls" style="display:none;">
  <h1>GSMS Report Card Generator</h1>
  <p class="sub">Select a class to pull its students' marks from Supabase and generate print-ready report cards.</p>
  <div class="row">
    <select id="classSelect"><option value="">Select class…</option></select>
    <button id="genBtn" disabled>Generate Report Cards</button>
    <button id="printBtn" class="secondary" disabled>Print / Save as PDF</button>
  </div>
  <div id="status"></div>
</div>

<div id="cardsArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ctuqlmdunhdhhholsqco.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jaogFl0uiNQW_3kkPakSrw_uVTwohtY';
const AUTH_REDIRECT = 'https://mygsms.in/auth.html';
const LOGO_URL = "https://sourabhsuneja.github.io/gsms-logo-short.png";

// Assumption: no "session" column exists anywhere in the schema, so this is a
// fixed constant. Edit this when the academic session changes.
const SESSION = "2026-27";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gateEl = document.getElementById('gate');
const controlsEl = document.getElementById('controls');
const classSelect = document.getElementById('classSelect');
const genBtn = document.getElementById('genBtn');
const printBtn = document.getElementById('printBtn');
const statusEl = document.getElementById('status');
const cardsArea = document.getElementById('cardsArea');

function setStatus(msg, isErr){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('err', !!isErr);
}

function showGate(mode, message){
  gateEl.style.display = 'block';
  controlsEl.style.display = 'none';
  if(mode === 'denied'){
    gateEl.classList.add('denied');
    gateEl.innerHTML = `<h2>Access Denied</h2><p>${message || 'This tool is restricted to school admins.'}</p>`;
  } else if(mode === 'error'){
    gateEl.classList.add('denied');
    gateEl.innerHTML = `<h2>Something went wrong</h2><p>${message || 'Please try again.'}</p>`;
  }
}

// jsonb columns normally arrive already parsed via the Supabase client, but
// handle the case where a value arrives as a JSON-encoded string too.
function parseJsonMaybe(val){
  if(val == null) return val;
  if(typeof val === 'object') return val;
  try{ return JSON.parse(val); } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Auth / admin gate ----------------
async function init(){
  try{
    const { data:{ session }, error: sessErr } = await sb.auth.getSession();
    if(sessErr) throw sessErr;
    if(!session){
      window.location.href = AUTH_REDIRECT + '?redirect=' + encodeURIComponent(window.location.href);
      return;
    }
    const { data: isAdmin, error: adminErr } = await sb.rpc('is_admin');
    if(adminErr) throw adminErr;
    if(!isAdmin){
      showGate('denied');
      return;
    }
    gateEl.style.display = 'none';
    controlsEl.style.display = 'block';
    await loadClasses();
  } catch(e){
    console.error(e);
    showGate('error', e.message || 'Could not verify access.');
  }
}

// ---------------- Data loading ----------------
async function loadClasses(){
  setStatus('Loading classes…');
  const { data, error } = await sb.from('classes').select('name');
  if(error){ setStatus('Failed to load classes: ' + error.message, true); return; }
  const names = (data || []).map(r => r.name).sort((a,b) => {
    const na = Number(a), nb = Number(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });
  names.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    classSelect.appendChild(opt);
  });
  setStatus('');
}

classSelect.addEventListener('change', () => {
  genBtn.disabled = !classSelect.value;
});

genBtn.addEventListener('click', async () => {
  const className = classSelect.value;
  if(!className) return;
  genBtn.disabled = true;
  printBtn.disabled = true;
  cardsArea.innerHTML = '';
  setStatus('Fetching data for ' + className + '…');

  try{
    // 1. Exams mapped to this class, in the order they were created.
    const { data: examRows, error: examErr } = await sb
      .from('exam_classes')
      .select('exam:exams(name, mm, components, added_at)')
      .eq('class', className);
    if(examErr) throw examErr;
    const exams = (examRows || [])
      .map(r => r.exam)
      .filter(Boolean)
      .sort((a,b) => new Date(a.added_at) - new Date(b.added_at))
      .map(e => ({ ...e, components: parseJsonMaybe(e.components) || [] }));

    if(exams.length === 0){
      setStatus('No exams are mapped to ' + className + ' yet.', true);
      genBtn.disabled = false;
      return;
    }

    // 2. Subjects mapped to this class, ordered by display_order.
    const { data: csRows, error: csErr } = await sb
      .from('class_subjects')
      .select('subject, subjects(display_order)')
      .eq('class', className);
    if(csErr) throw csErr;
    const subjects = (csRows || [])
      .sort((a,b) => (a.subjects?.display_order ?? 0) - (b.subjects?.display_order ?? 0))
      .map(r => r.subject);

    if(subjects.length === 0){
      setStatus('No subjects are mapped to ' + className + ' yet.', true);
      genBtn.disabled = false;
      return;
    }

    // 3. Students in this class.
    const { data: students, error: stuErr } = await sb
      .from('students_master')
      .select('id, roll_no, sr_no, name')
      .eq('class', className)
      .order('roll_no', { ascending: true, nullsFirst: false });
    if(stuErr) throw stuErr;

    if(!students || students.length === 0){
      setStatus('No students found in ' + className + '.', true);
      genBtn.disabled = false;
      return;
    }

    // 4. Marks for this class, for the mapped exams only.
    const examNames = exams.map(e => e.name);
    const { data: marks, error: marksErr } = await sb
      .from('marks')
      .select('student_id, exam_name, subject, status, marks_obtained, component_marks')
      .eq('class', className)
      .in('exam_name', examNames);
    if(marksErr) throw marksErr;

    const marksMap = new Map();
    (marks || []).forEach(m => {
      marksMap.set(m.student_id + '__' + m.exam_name + '__' + m.subject, m);
    });

    cardsArea.innerHTML = students
      .map(s => renderReportCard(s, className, exams, subjects, marksMap))
      .join('');

    setStatus(`Generated ${students.length} report card(s) for ${className}.`);
    printBtn.disabled = false;
  } catch(e){
    console.error(e);
    setStatus('Failed to generate report cards: ' + (e.message || e), true);
  } finally {
    genBtn.disabled = false;
  }
});

printBtn.addEventListener('click', () => window.print());

// ---------------- Rendering ----------------
function renderExamSection(exam, subjects, student, marksMap, showTitle){
  const components = exam.components; // [{mm, name}, ...]
  const colTotals = components.map(() => 0);
  let grandObtained = 0;
  const grandMax = subjects.length * exam.mm;
  let anyObtained = false;

  const rows = subjects.map(subj => {
    const m = marksMap.get(student.id + '__' + exam.name + '__' + subj);
    let cellsHtml;
    if(!m){
      cellsHtml = components.map(() => '<td></td>').join('') + '<td></td>';
    } else if(m.status !== 'P'){
      const label = m.status === 'AB' ? 'Ab' : m.status; // L / ML shown as-is
      cellsHtml = components.map(() => `<td class="status-cell">${label}</td>`).join('')
        + `<td class="status-cell">${label}</td>`;
    } else {
      const cm = parseJsonMaybe(m.component_marks) || {};
      const compCells = components.map((c, i) => {
        const v = cm[c.name];
        if(v !== undefined && v !== null && v !== ''){
          colTotals[i] += Number(v);
          return `<td>${v}</td>`;
        }
        return '<td></td>';
      }).join('');
      let totalCell = '<td></td>';
      if(m.marks_obtained !== null && m.marks_obtained !== undefined){
        const total = Number(m.marks_obtained);
        grandObtained += total;
        anyObtained = true;
        totalCell = `<td>${total}</td>`;
      }
      cellsHtml = compCells + totalCell;
    }
    return `<tr><td class="subject">${escapeHtml(subj)}</td>${cellsHtml}</tr>`;
  }).join('');

  const colSpan = components.length + 1;
  const titleHtml = showTitle
    ? `<p class="section-title">${escapeHtml(exam.name).toUpperCase()}</p>`
    : '';

  return `
    ${titleHtml}
    <table class="marks-table">
      <tr>
        <th class="subject shade1" rowspan="3">Subject</th>
        <th class="shade1" colspan="${colSpan}">${escapeHtml(exam.name)}</th>
      </tr>
      <tr>
        ${components.map(c => `<th class="shade2">${escapeHtml(c.name)}</th>`).join('')}
        <th class="shade2">Total</th>
      </tr>
      <tr>
        ${components.map(c => `<th class="shade3">${c.mm}</th>`).join('')}
        <th class="shade3">${exam.mm}</th>
      </tr>
      ${rows}
      <tr class="grand">
        <td>GRAND TOTAL</td>
        ${colTotals.map((t, i) => `<td>${t} / ${subjects.length * components[i].mm}</td>`).join('')}
        <td>${anyObtained ? grandObtained : ''} / ${grandMax}</td>
      </tr>
    </table>`;
}

function renderReportCard(student, className, exams, subjects, marksMap){
  const examSectionsHtml = exams
    .map((exam, idx) => renderExamSection(exam, subjects, student, marksMap, idx > 0))
    .join('');

  return `
  <div class="page">
    <div class="hdr">
      <img src="${LOGO_URL}" alt="School Logo">
      <p class="t1">APPLIED LEARNING ASSESSMENT ${SESSION}</p>
      <p class="t2">MARKSHEET</p>
      <p class="t3">CLASS ${escapeHtml(String(className)).toUpperCase()} &nbsp;|&nbsp; SESSION ${SESSION}</p>
    </div>

    <table class="idtable">
      <tr>
        <td class="lbl">Student Name</td><td class="val">${escapeHtml(student.name)}</td>
        <td class="lbl">Roll No.</td><td class="val">${student.roll_no ?? ''}</td>
      </tr>
    </table>

    ${examSectionsHtml}

    <p class="pronounce">General Pronouncement: ________________________________</p>
    <div class="signrow">
      <span>Academic Director</span><span>Coordinator</span><span>Class Teacher</span>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
