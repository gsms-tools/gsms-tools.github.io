   body {
   padding: 0;

   // Where to send a user who isn't logged in / isn't an admin
   const DASHBOARD_URL = "https://mygsms.in";
</script>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay">
   <div class="spinner"></div>
</div>

<div id="accessDenied" class="hidden"></div>

<div class="container hidden" id="appContainer">

   <!-- Selection panel: pick class + exam (new schema has no URL-driven view,
        so classes/exams are fetched live from Supabase for the admin to choose) -->
   <div id="selectionPanel">
      <h2>Generate Consolidated Marks Statement</h2>
      <div class="field-group">
         <label for="classSelect">Class</label>
         <select id="classSelect">
            <option value="">Loading classes&hellip;</option>
         </select>
      </div>
      <div class="field-group">
         <label for="examSelect">Exam</label>
         <select id="examSelect" disabled>
            <option value="">Select a class first</option>
         </select>
      </div>

      <button id="generateBtn" disabled>Generate Statement</button>
   </div>

   <div id="changeSelectionWrap" class="hidden">
      <button id="changeSelectionBtn">&larr; Change class / exam</button>
   </div>

   <div class="header hidden" id="reportHeader">
      <div class="school-name" id="school-name-display"></div>
      <div class="exam-session"><span id="exam-name"></span> (<span id="session-label"></span>)</div>
      <div class="class-info">Class: <span id="class-name"></span><br><span id="timestamp-info"></span></div>
   </div>

      <!-- Table will be dynamically generated -->

<script>
   // ------------------------------------------------------------------
   // Setup
   // ------------------------------------------------------------------
   const loadingOverlay = document.getElementById('loading-overlay');
   const appContainer = document.getElementById('appContainer');
   const accessDeniedEl = document.getElementById('accessDenied');

   const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

   // State
   let classesCache = [];      // [{name}]
   let examsCache = [];        // [{name, mm, components}] applicable to the chosen class
   let selectedClass = '';
   let selectedExam = '';
   let digitalSignature = '';

   document.getElementById('school-name-display').textContent = SCHOOL_NAME;

   function showLoading() { loadingOverlay.classList.remove('hidden'); }
   function hideLoading() { loadingOverlay.classList.add('hidden'); }

   function showAccessDenied(message) {
      appContainer.classList.add('hidden');
      accessDeniedEl.textContent = message;
      accessDeniedEl.classList.remove('hidden');
      hideLoading();
   }

   // Natural sort so "Grade 2" sorts before "Grade 10"
   function naturalCompare(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
   }

   // ------------------------------------------------------------------
   // Rank calculation (same tie-handling logic as the old statement)
   // ------------------------------------------------------------------
   function calculateRanks(values) {
      const indexedValues = values.map((value, index) => ({ value, index }));
      indexedValues.sort((a, b) => b.value - a.value);

      const ranks = new Array(values.length).fill(0);
      let currentRank = 1;

      for (let i = 0; i < indexedValues.length; i++) {
         if (i > 0 && indexedValues[i].value === indexedValues[i - 1].value) {
            ranks[indexedValues[i].index] = ranks[indexedValues[i - 1].index];
         } else {
            ranks[indexedValues[i].index] = currentRank;
         }
         if (i === indexedValues.length - 1 ||
             indexedValues[i].value !== indexedValues[i + 1].value) {
            currentRank++;
         }
      }
      return ranks;
   }

   // ------------------------------------------------------------------
   // Auth / admin check
   // ------------------------------------------------------------------
   async function checkAdminAccess() {
      const { data: { session }, error: sessionError } = await sb.auth.getSession();

      if (sessionError || !session) {
         window.location.href = DASHBOARD_URL;
         return false;
      }

      // Prefer the get_my_role() RPC (defined in the schema); fall back to a
      // direct admins-table lookup if the RPC isn't reachable for some reason.
      try {
         const { data: role, error: roleError } = await sb.rpc('get_my_role');
         if (!roleError && role === 'admin') return true;
         if (!roleError) {
            showAccessDenied('This page is only available to admin accounts.');
            return false;
         }
      } catch (e) {
         // fall through to direct lookup
      }

      const { data: adminRow, error: adminError } = await sb
         .from('admins')
         .select('id')
         .eq('id', session.user.id)
         .maybeSingle();

      if (adminError || !adminRow) {
         showAccessDenied('This page is only available to admin accounts.');
         return false;
      }
      return true;
   }

   // ------------------------------------------------------------------
   // Data loading: classes & exams for the selection panel
   // ------------------------------------------------------------------
   async function loadClasses() {
      const { data, error } = await sb.from('classes').select('name');
      if (error) throw error;
      classesCache = (data || []).slice().sort((a, b) => naturalCompare(a.name, b.name));

      const classSelect = document.getElementById('classSelect');
      classSelect.innerHTML = '<option value="">-- Select Class --</option>' +
         classesCache.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
   }

   async function loadExamsForClass(className) {
      const examSelect = document.getElementById('examSelect');
      examSelect.innerHTML = '<option value="">Loading exams&hellip;</option>';
      examSelect.disabled = true;
      document.getElementById('generateBtn').disabled = true;

      // Exams registered for this class via exam_classes
      const { data: mapRows, error: mapError } = await sb
         .from('exam_classes')
         .select('exam')
         .eq('class', className);

      if (mapError) throw mapError;

      let examNames = (mapRows || []).map(r => r.exam);

      // Graceful fallback: if nothing is mapped for this class yet, offer every
      // registered exam rather than leaving the admin with an empty dropdown.
      let examRows;
      if (examNames.length > 0) {
         const { data, error } = await sb
            .from('exams')
            .select('name, mm, components')
            .in('name', examNames)
            .order('added_at', { ascending: true });
         if (error) throw error;
         examRows = data;
      } else {
         const { data, error } = await sb
            .from('exams')
            .select('name, mm, components')
            .order('added_at', { ascending: true });
         if (error) throw error;
         examRows = data;
      }

      examsCache = examRows || [];

      if (examsCache.length === 0) {
         examSelect.innerHTML = '<option value="">No exams available</option>';
         examSelect.disabled = true;
         return;
      }

      examSelect.innerHTML = '<option value="">-- Select Exam --</option>' +
         examsCache.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('');
      examSelect.disabled = false;
   }

   function escapeHtml(str) {
      return String(str)
         .replace(/&/g, '&amp;')
         .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;')
         .replace(/"/g, '&quot;');
   }

   // ------------------------------------------------------------------
   // Core report generation
   // ------------------------------------------------------------------
   function getExamDefinition(examName) {
      return examsCache.find(e => e.name === examName) || null;
   }

   // Returns the ordered list of "columns" for a subject under this exam:
   // either the exam's component breakdown, or a single implicit column.
   function getExamComponents(examDef) {
      if (examDef && Array.isArray(examDef.components) && examDef.components.length > 0) {
         return examDef.components; // [{mm, name}, ...]
      }
      return null; // single-column exam
   }

   function formatMark(num) {
      if (num === null || num === undefined || isNaN(num)) return '-';
      const n = Number(num);
      return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
   }

   function statusLabel(status) {
      // Mirrors the old statement's "Ab" convention, extended to the new
      // schema's explicit status codes.
      switch (status) {
         case 'AB': return 'Ab';
         case 'L': return 'L';
         case 'ML': return 'ML';
         default: return status || '-';
      }
   }

   async function generateReport(className, examName) {
      showLoading();
      document.getElementById('selectionError').textContent = '';

      try {
         const examDef = getExamDefinition(examName);
         if (!examDef) throw new Error('Selected exam could not be found.');

         const components = getExamComponents(examDef);
         const examMM = examDef.mm;

         // Subjects that apply to this class (ordered by display_order)
         const { data: subjRows, error: subjError } = await sb
            .from('class_subjects')
            .select('subject, subjects(display_order)')
            .eq('class', className);
         if (subjError) throw subjError;

         const selectedSubjects = (subjRows || [])
            .slice()
            .sort((a, b) => {
               const oa = a.subjects ? a.subjects.display_order : 0;
               const ob = b.subjects ? b.subjects.display_order : 0;
               return oa - ob;
            })
            .map(r => r.subject);

         if (selectedSubjects.length === 0) {
            throw new Error('No subjects are mapped to this class yet.');
         }

         // Students in this class, ordered by roll number (falling back to sr_no)
         const { data: students, error: studError } = await sb
            .from('students_master')
            .select('id, name, roll_no, sr_no')
            .eq('class', className)
            .order('roll_no', { ascending: true, nullsFirst: false })
            .order('sr_no', { ascending: true, nullsFirst: false });
         if (studError) throw studError;

         if (!students || students.length === 0) {
            throw new Error('No students found for this class.');
         }

         // Marks for this class + this standard exam (custom/one-off exams are
         // intentionally excluded, same as the admin only picking from the
         // registered "exams" list in the selection panel)
         const { data: marksRows, error: marksError } = await sb
            .from('marks')
            .select('id, student_id, subject, status, marks_obtained, component_marks, updated_at')
            .eq('class', className)
            .eq('exam_name', examName);
         if (marksError) throw marksError;

         digitalSignature = await generateNumericSignature(marksRows || []);

         renderTable({
            className, examName, examMM, components,
            selectedSubjects, students, marksRows: marksRows || []
         });

         document.getElementById('exam-name').textContent = examName;
         document.getElementById('session-label').textContent = SCHOOL_SESSION;
         document.getElementById('class-name').textContent = className;
         document.getElementById('timestamp-info').textContent =
            'Generated on ' + getFormattedDateTime() + ' | Digital Signature: ' + digitalSignature;

         document.getElementById('selectionPanel').classList.add('hidden');
         document.getElementById('changeSelectionWrap').classList.remove('hidden');
         document.getElementById('reportHeader').classList.remove('hidden');
         document.getElementById('marks-table').classList.remove('hidden');
         document.getElementById('printBtn').classList.remove('hidden');

         updateUrlParams(className, examName);
      } catch (err) {
         console.error(err);
         document.getElementById('selectionError').textContent =
            err && err.message ? err.message : 'Failed to generate the statement.';
      } finally {
         hideLoading();
      }
   }

   function renderTable({ className, examName, examMM, components, selectedSubjects, students, marksRows }) {
      const table = document.getElementById('marks-table');
      table.innerHTML = '';

      const headerRow1 = document.createElement('tr');
      const headerRow2 = document.createElement('tr');

      const rollHeader = document.createElement('th');
      rollHeader.textContent = 'Roll No.';
      rollHeader.rowSpan = 2;
      rollHeader.classList.add('roll-col');
      headerRow1.appendChild(rollHeader);

      const nameHeader = document.createElement('th');
      nameHeader.textContent = 'Student Name';
      nameHeader.rowSpan = 2;
      nameHeader.classList.add('name-col');
      headerRow1.appendChild(nameHeader);

      // Subject headers -- component breakdown is defined once per exam and
      // applies uniformly to every subject (unlike the old per-subject model)
      const columnCountPerSubject = components ? components.length + 1 : 1;

      selectedSubjects.forEach(subject => {
         const subjectHeader = document.createElement('th');
         subjectHeader.textContent = subject;
         subjectHeader.colSpan = columnCountPerSubject;
         subjectHeader.classList.add('subject-header');
         headerRow1.appendChild(subjectHeader);

         if (components) {
            components.forEach(comp => {
               const th = document.createElement('th');
               th.innerHTML = escapeHtml(comp.name) + '<hr>' + comp.mm + 'M';
               th.classList.add('mark-col');
               headerRow2.appendChild(th);
            });
            const totalTh = document.createElement('th');
            totalTh.innerHTML = 'Total<hr>' + examMM + 'M';
            totalTh.classList.add('mark-col');
            headerRow2.appendChild(totalTh);
         } else {
            const th = document.createElement('th');
            th.innerHTML = examMM + 'M';
            th.classList.add('mark-col');
            headerRow2.appendChild(th);
         }
      });

      // Grand Total header
      const totalHeader = document.createElement('th');
      totalHeader.textContent = 'Total';
      headerRow1.appendChild(totalHeader);

      const aggregateTotal = examMM * selectedSubjects.length;
      const aggregateHeader = document.createElement('th');
      aggregateHeader.textContent = aggregateTotal + 'M';
      headerRow2.appendChild(aggregateHeader);

      // Rank header
      const rankHeader = document.createElement('th');
      rankHeader.textContent = 'Rank';
      rankHeader.rowSpan = 2;
      headerRow1.appendChild(rankHeader);

      table.appendChild(headerRow1);
      table.appendChild(headerRow2);

      const studentTotals = [];
      const studentRows = [];

      students.forEach((student, idx) => {
         const row = document.createElement('tr');

         const serialNum = (idx + 1).toString().padStart(2, '0');
         const rollNo = student.roll_no != null ? student.roll_no
                       : (student.sr_no != null ? student.sr_no : serialNum);

         const rollCell = document.createElement('td');
         rollCell.textContent = rollNo;
         row.appendChild(rollCell);

         const nameCell = document.createElement('td');
         nameCell.textContent = (student.name || '').toUpperCase();
         nameCell.style.textAlign = 'left';
         row.appendChild(nameCell);

         let grandTotal = 0;

         selectedSubjects.forEach(subject => {
            const markRow = marksRows.find(m => m.student_id === student.id && m.subject === subject);

            if (!markRow) {
               // No record entered at all for this subject/exam
               const cell = document.createElement('td');
               cell.textContent = '-';
               cell.colSpan = columnCountPerSubject;
               cell.classList.add('mark-cell');
               cell.dataset.name = student.name;
               cell.dataset.subject = subject;
               row.appendChild(cell);
               return;
            }

            if (markRow.status !== 'P') {
               // Absent / on leave / medical leave -- single merged status cell
               const cell = document.createElement('td');
               cell.textContent = statusLabel(markRow.status);
               cell.colSpan = columnCountPerSubject;
               cell.classList.add('mark-cell', 'status-cell');
               cell.style.fontWeight = 'bold';
               cell.dataset.name = student.name;
               cell.dataset.subject = subject;
               row.appendChild(cell);
               return;
            }

            // Present: show component breakdown (if any) + subject total
            if (components) {
               components.forEach(comp => {
                  const cell = document.createElement('td');
                  cell.classList.add('mark-cell');
                  cell.dataset.name = student.name;
                  cell.dataset.subject = subject;
                  const compVal = markRow.component_marks ? markRow.component_marks[comp.name] : undefined;
                  cell.textContent = (compVal === undefined || compVal === null) ? '-' : formatMark(compVal);
                  row.appendChild(cell);
               });
            }

            const totalCell = document.createElement('td');
            totalCell.classList.add('mark-cell');
            totalCell.dataset.name = student.name;
            totalCell.dataset.subject = subject;
            totalCell.style.fontWeight = 'bold';

            const subjectTotal = markRow.marks_obtained !== null && markRow.marks_obtained !== undefined
               ? Number(markRow.marks_obtained)
               : (components
                  ? components.reduce((sum, comp) => {
                       const v = markRow.component_marks ? markRow.component_marks[comp.name] : null;
                       return sum + (v !== null && v !== undefined ? Number(v) : 0);
                    }, 0)
                  : 0);

            totalCell.textContent = formatMark(subjectTotal);
            row.appendChild(totalCell);

            grandTotal += subjectTotal;
         });

         const grandTotalCell = document.createElement('td');
         grandTotalCell.textContent = formatMark(grandTotal);
         grandTotalCell.style.fontWeight = 'bold';
         row.appendChild(grandTotalCell);

         const rankCell = document.createElement('td');
         rankCell.classList.add('rank-cell');
         row.appendChild(rankCell);

         studentRows.push(row);
         studentTotals.push(grandTotal);
         table.appendChild(row);
      });

      const ranks = calculateRanks(studentTotals);
      studentRows.forEach((row, idx) => {
         const rankCell = row.querySelector('.rank-cell');
         rankCell.textContent = ranks[idx];
         if (ranks[idx] === 1 || ranks[idx] === 2 || ranks[idx] === 3) {
            rankCell.classList.add('highlight-rank');
         }
      });
   }

   // ------------------------------------------------------------------
   // Digital signature (tamper-evidence) -- same approach as the old
   // statement: a canonical, deterministic string hashed with SHA-256 and
   // shrunk to a 12-digit number, so any change in the underlying marks
   // changes the signature.
   // ------------------------------------------------------------------
   async function generateNumericSignature(marksData) {
      const sorted = [...marksData].sort((a, b) => Number(a.id) - Number(b.id));

      const canonicalString = sorted
         .map(item => {
            const compPart = item.component_marks ? JSON.stringify(sortObjectKeys(item.component_marks)) : 'null';
            return `${item.id}:${item.subject}:${item.status}:${item.marks_obtained}:${compPart}`;
         })
         .join('|');

      const msgBuffer = new TextEncoder().encode(canonicalString);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);

      const hashArray = Array.from(new Uint8Array(hashBuffer));
      let bigNum = 0n;
      for (const byte of hashArray) {
         bigNum = (bigNum << 8n) + BigInt(byte);
      }

      const signature = bigNum % 1000000000000n;
      return signature.toString().padStart(12, '0');
   }

   function sortObjectKeys(obj) {
      return Object.keys(obj).sort().reduce((acc, key) => {
         acc[key] = obj[key];
         return acc;
      }, {});
   }

   function getFormattedDateTime() {
      const now = new Date();
      const options = {
         month: 'short', day: 'numeric', year: 'numeric',
         hour: 'numeric', minute: '2-digit', hour12: true
      };
      return now.toLocaleString('en-US', options);
   }

   // ------------------------------------------------------------------
   // URL param helpers (kept for deep-linking parity with the old page)
   // ------------------------------------------------------------------
   function updateUrlParams(className, examName) {
      const url = new URL(window.location.href);
      url.searchParams.set('class', className);
      url.searchParams.set('exam', examName);
      window.history.replaceState({}, '', url);
   }

   function resetToSelectionPanel() {
      document.getElementById('selectionPanel').classList.remove('hidden');
      document.getElementById('changeSelectionWrap').classList.add('hidden');
      document.getElementById('reportHeader').classList.add('hidden');
      document.getElementById('marks-table').classList.add('hidden');
      document.getElementById('printBtn').classList.add('hidden');
   }

   // ------------------------------------------------------------------
   // Wiring
   // ------------------------------------------------------------------
   document.getElementById('classSelect').addEventListener('change', async (e) => {
      selectedClass = e.target.value;
      document.getElementById('examSelect').value = '';
      document.getElementById('generateBtn').disabled = true;
      if (!selectedClass) {
         document.getElementById('examSelect').innerHTML = '<option value="">Select a class first</option>';
         document.getElementById('examSelect').disabled = true;
         return;
      }
      try {
         await loadExamsForClass(selectedClass);
      } catch (err) {
         console.error(err);
         document.getElementById('selectionError').textContent = 'Failed to load exams for this class.';
      }
   });

   document.getElementById('examSelect').addEventListener('change', (e) => {
      selectedExam = e.target.value;
      document.getElementById('generateBtn').disabled = !(selectedClass && selectedExam);
   });

   document.getElementById('generateBtn').addEventListener('click', () => {
      if (selectedClass && selectedExam) {
         generateReport(selectedClass, selectedExam);
      }
   });

   document.getElementById('changeSelectionBtn').addEventListener('click', () => {
      resetToSelectionPanel();
   });

   // ------------------------------------------------------------------
   // Boot
   // ------------------------------------------------------------------
   window.addEventListener('load', async () => {
      showLoading();
      try {
         const allowed = await checkAdminAccess();
         if (!allowed) return;

         appContainer.classList.remove('hidden');
         await loadClasses();

         // Deep-link support: ?class=...&exam=...
         const urlParams = new URLSearchParams(window.location.search);
         const classParam = urlParams.get('class');
         const examParam = urlParams.get('exam');

         if (classParam && classesCache.some(c => c.name === classParam)) {
            document.getElementById('classSelect').value = classParam;
            selectedClass = classParam;
            await loadExamsForClass(classParam);

            if (examParam && examsCache.some(ex => ex.name === examParam)) {
               document.getElementById('examSelect').value = examParam;
               selectedExam = examParam;
               document.getElementById('generateBtn').disabled = false;
               await generateReport(classParam, examParam);
               return;
            }
         }

         hideLoading();
      } catch (err) {
         console.error('Startup error:', err);
         showAccessDenied('Something went wrong while loading this page. Please refresh and try again.');
      }
   });
</script>
